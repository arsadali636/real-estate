services:
  db:
    image: postgres:15-alpine
    container_name: estateflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estateflow_crm
      POSTGRES_USER: estateflow
      POSTGRES_PASSWORD: estateflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateflow -d estateflow_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estateflow_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://estateflow:estateflow_password@db:5432/estateflow_crm
      DJANGO_SECRET_KEY: dev-insecure-key-estateflow-docker-2026
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      AUTO_SEED: "true"
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: estateflow_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
